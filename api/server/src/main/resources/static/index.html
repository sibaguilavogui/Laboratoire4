<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des tickets - Bonus Lab 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        .section {
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
        }
        label {
            display: block;
            margin-top: 6px;
        }
        input[type="text"], select {
            padding: 4px;
            width: 250px;
        }
        button {
            margin-top: 10px;
            padding: 6px 12px;
            cursor: pointer;
        }
        ul {
            padding-left: 18px;
        }
        li {
            margin-bottom: 4px;
        }
        .status {
            margin-top: 8px;
            font-size: 0.9em;
            color: #555;
        }
        .error {
            color: darkred;
        }
        .success {
            color: darkgreen;
        }
    </style>
</head>
<body>

<h1>Interface Web – API Tickets (Bonus)</h1>

<div class="section">
    <h2>1. Liste des tickets</h2>
    <button onclick="chargerTickets()">Charger les tickets</button>
    <div id="listeStatus" class="status"></div>
    <ul id="listeTickets"></ul>
</div>

<div class="section">
    <h2>2. Créer un nouveau ticket</h2>

    <label for="titre">Titre du ticket :</label>
    <input type="text" id="titre" placeholder="Ex : Problème de connexion">

    <label for="priorite">Priorité :</label>
    <select id="priorite">
        <option value="BASSE">BASSE</option>
        <option value="MOYENNE" selected>MOYENNE</option>
        <option value="HAUTE">HAUTE</option>
    </select>

    <br>
    <button onclick="creerTicket()">Créer le ticket</button>
    <div id="creationStatus" class="status"></div>
</div>

<script>
    const API_BASE = "http://localhost:8080";

    // ======= 1. Lister les tickets =======
    async function chargerTickets() {
        const statusDiv = document.getElementById("listeStatus");
        const ul = document.getElementById("listeTickets");
        statusDiv.textContent = "Chargement...";
        statusDiv.className = "status";

        try {
            const response = await fetch(API_BASE + "/tickets");
            if (!response.ok) {
                throw new Error("Réponse HTTP " + response.status);
            }

            const tickets = await response.json();
            ul.innerHTML = "";

            if (tickets.length === 0) {
                statusDiv.textContent = "Aucun ticket pour le moment.";
                return;
            }

            tickets.forEach(t => {
                const li = document.createElement("li");
                const status = t.status ? t.status : "N/A";
                const prio = t.priority ? t.priority : "N/A";
                const id = t.ticketID ?? t.id ?? "?";

                li.textContent =
                    "#" + id + " - " + t.title
                    + " | Statut: " + status
                    + " | Priorité: " + prio;

                ul.appendChild(li);
            });

            statusDiv.textContent = "Tickets chargés.";
            statusDiv.classList.add("success");
        } catch (err) {
            statusDiv.textContent = "Erreur lors du chargement : " + err.message;
            statusDiv.classList.add("error");
        }
    }

    // ======= 2. Créer un ticket =======
    async function creerTicket() {
        const titreInput = document.getElementById("titre");
        const prioSelect = document.getElementById("priorite");
        const statusDiv = document.getElementById("creationStatus");

        const titre = titreInput.value.trim();
        const priorite = prioSelect.value;

        statusDiv.textContent = "";
        statusDiv.className = "status";

        if (titre === "") {
            statusDiv.textContent = "Veuillez saisir un titre.";
            statusDiv.classList.add("error");
            return;
        }

        const body = {
            title: titre,
            priority: priorite
        };

        try {
            statusDiv.textContent = "Création en cours...";
            const response = await fetch(API_BASE + "/tickets", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                // 201 attendu
                throw new Error("Réponse HTTP " + response.status);
            }

            const created = await response.json();
            const id = created.ticketID ?? created.id ?? "?";
            statusDiv.textContent = "Ticket créé (#" + id + ").";
            statusDiv.classList.add("success");

            // on efface le champ et on recharge la liste
            titreInput.value = "";
            chargerTickets();

        } catch (err) {
            statusDiv.textContent = "Erreur lors de la création : " + err.message;
            statusDiv.classList.add("error");
        }
    }
</script>

</body>
</html>
